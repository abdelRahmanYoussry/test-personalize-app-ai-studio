
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Persona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee2bad",
                        "primary-container": "#4d0033",
                        "on-primary-container": "#ffd8eb",
                        "surface": "#1d1b1e",
                        "surface-variant": "#49454f",
                        "background-dark": "#141218",
                        "glass": "rgba(255, 255, 255, 0.04)",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "m3": "28px",
                    },
                    boxShadow: {
                        "m3-1": "0 1px 3px 1px rgba(0,0,0,0.15), 0 1px 2px 0 rgba(0,0,0,0.3)",
                        "m3-2": "0 2px 6px 2px rgba(0,0,0,0.15), 0 1px 2px 0 rgba(0,0,0,0.3)",
                        "neon": "0 0 20px rgba(238, 43, 173, 0.4)",
                    },
                    animation: {
                        'ripple': 'ripple 0.6s linear forwards',
                        'fade-in': 'fade-in 0.5s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 2s infinite linear',
                        'scale-in': 'scale-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'slide-up': 'slide-up 0.4s ease-out'
                    },
                    keyframes: {
                        ripple: {
                            '0%': { transform: 'scale(0)', opacity: '0.35' },
                            '100%': { transform: 'scale(4)', opacity: '0' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        shimmer: {
                            '0%': { transform: 'translateX(-150%) skewX(-12deg)' },
                            '100%': { transform: 'translateX(150%) skewX(-12deg)' },
                        },
                        'scale-in': {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        'slide-up': {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #141218;
            color: #e6e1e5;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .m3-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            transition: background-color 0.2s;
        }
        .m3-card:active {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(238, 43, 173, 0.5);
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
