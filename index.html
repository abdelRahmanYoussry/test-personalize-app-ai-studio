
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Persona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee2bad",
                        "primary-dark": "#b01b7d",
                        "background-dark": "#22101c",
                        "surface-dark": "#2d1b29",
                        "glass": "rgba(255, 255, 255, 0.05)",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    boxShadow: {
                        "neon": "0 0 15px rgba(238, 43, 173, 0.5)",
                        "neon-strong": "0 0 25px rgba(238, 43, 173, 0.7)",
                        "glass": "0 8px 32px 0 rgba(0, 0, 0, 0.37)",
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 2s infinite linear',
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        shimmer: {
                            '0%': { transform: 'translateX(-150%) skewX(-12deg)' },
                            '100%': { transform: 'translateX(150%) skewX(-12deg)' },
                        },
                        'pulse-glow': {
                            '0%, 100%': { opacity: '1', boxShadow: '0 0 15px #ee2bad' },
                            '50%': { opacity: '.7', boxShadow: '0 0 5px #ee2bad' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #22101c;
            color: white;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }
        .bg-cinema-grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(238, 43, 173, 0.6);
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>

</head>
